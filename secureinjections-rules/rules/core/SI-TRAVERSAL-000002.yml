attack_patterns:
- ../../../../etc/passwd
regex_patterns:
- (?:\.\.[/\\]){1,64}(?:etc[/\\](?:passwd|shadow|hosts)|proc[/\\]self[/\\]environ|windows[/\\]win\.ini)
literal_patterns: []
semantic_examples:
- ../../../../etc/passwd
- Climb beyond the application directory and return the host authentication database.
- Open an ancestor path to obtain a private identity file from outside the sandbox.
negative_examples:
- A benign discussion of traversal to sensitive file defenses.
- Documentation lists sensitive paths so defenders can deny them.
- A security course quotes an attempted traversal to a password file.
- The scanner test verifies that an inert path example is rejected.
- An incident analyst describes a failed request for a file outside the web root.
