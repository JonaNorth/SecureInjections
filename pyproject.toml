[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "secureinjections"
version = "0.6.0rc1"
description = "Local deterministic security enforcement for LLM and agent boundaries"
readme = "README.md"
requires-python = ">=3.11"
# Apache-2.0 describes only the explicit Community export; see NOTICE.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SecureInjections contributors" }]
keywords = ["security", "prompt-injection", "llm", "agents", "guard-proxy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "uvicorn>=0.29"]
flask = ["flask>=3.0"]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
test = [
  "pytest>=8.0",
  "pytest-benchmark>=4.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "flask>=3.0",
  "numpy>=1.26",
  "cryptography>=42.0",
]

[dependency-groups]
research = [
  "cryptography>=42.0",
  "numpy>=1.26",
  "safetensors>=0.4",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "transformers>=4.40",
]
dev = [
  "secureinjections[test]",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "build>=1.2",
]

[project.scripts]
secureinjections = "secureinjections.community_cli:main"

[project.urls]
Homepage = "https://github.com/JonaNorth/SecureInjections"
Issues = "https://github.com/JonaNorth/SecureInjections/issues"

[tool.hatch.build.targets.wheel]
packages = ["secureinjections"]
exclude = [
  "/secureinjections/active_learning.py",
  "/secureinjections/classifier-corpus-schema-v2.json",
  "/secureinjections/classifier.py",
  "/secureinjections/classifier_calibration.py",
  "/secureinjections/classifier_data.py",
  "/secureinjections/classifier_evaluation.py",
  "/secureinjections/classifier_training.py",
  "/secureinjections/cli.py",
  "/secureinjections/corpus.py",
  "/secureinjections/dataset_foundation.py",
  "/secureinjections/detectors/semantic_embeddings.py",
  "/secureinjections/detectors/semantic_index.py",
  "/secureinjections/evaluation.py",
  "/secureinjections/evidence_factory.py",
  "/secureinjections/evidence_reviewer_contract.py",
  "/secureinjections/evidence_taxonomy.py",
  "/secureinjections/model-import-schema-v1.json",
  "/secureinjections/model_import.py",
  "/secureinjections/phase1_diagnostics.py",
  "/secureinjections/phase2_1_diagnostics.py",
  "/secureinjections/phase2_2_representation.py",
  "/secureinjections/phase2_validation.py",
  "/secureinjections/phase3_adaptation.py",
  "/secureinjections/pilot_human_audit.py",
  "/secureinjections/relationship_consensus.py",
  "/secureinjections/release.py",
  "/secureinjections/research_training.py",
  "/secureinjections/review_interactive.py",
  "/secureinjections/review_workflow.py",
  "/secureinjections/rules/bundled",
  "/secureinjections/rules/migration.py",
  "/secureinjections/rules/quality.py",
  "/secureinjections/rules/v1",
  "/secureinjections/semantic-models.json",
  "/secureinjections/semantic_models.py",
  "/secureinjections/semantic_registry.py",
  "/secureinjections/threatintel",
]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/benchmarks",
  "/development",
  "/evaluation",
  "/dist",
  "/release",
  "/corpus",
  "/scripts",
  "/secureinjections-rules",
  "/tests",
  "/tools",
  "/docs/archive",
  "/docs/v0.4.2-*",
  "/secureinjections/active_learning.py",
  "/secureinjections/classifier.py",
  "/secureinjections/classifier-corpus-schema-v2.json",
  "/secureinjections/classifier_calibration.py",
  "/secureinjections/classifier_data.py",
  "/secureinjections/classifier_evaluation.py",
  "/secureinjections/classifier_training.py",
  "/secureinjections/cli.py",
  "/secureinjections/corpus.py",
  "/secureinjections/dataset_foundation.py",
  "/secureinjections/detectors/semantic_embeddings.py",
  "/secureinjections/detectors/semantic_index.py",
  "/secureinjections/evaluation.py",
  "/secureinjections/evidence_*",
  "/secureinjections/model-import-schema-v1.json",
  "/secureinjections/model_import.py",
  "/secureinjections/phase1_diagnostics.py",
  "/secureinjections/phase2_1_diagnostics.py",
  "/secureinjections/phase2_2_representation.py",
  "/secureinjections/phase2_validation.py",
  "/secureinjections/phase3_adaptation.py",
  "/secureinjections/pilot_human_audit.py",
  "/secureinjections/relationship_consensus.py",
  "/secureinjections/release.py",
  "/secureinjections/research_training.py",
  "/secureinjections/review_*",
  "/secureinjections/rules/bundled",
  "/secureinjections/rules/migration.py",
  "/secureinjections/rules/quality.py",
  "/secureinjections/rules/v1",
  "/secureinjections/semantic*",
  "/secureinjections/threatintel",
  "/examples/**/state/*",
  "/examples/**/audit/*",
  "/examples/**/logs/*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["benchmark: performance-oriented tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# Optional implementations are deliberately absent from the Community export.
[[tool.mypy.overrides]]
module = ["secureinjections.classifier", "secureinjections.detectors.semantic_embeddings"]
ignore_missing_imports = true
