name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: pytest
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy secureinjections
      - run: python tools/update_readme_metrics.py --check
      - run: secureinjections rules quality-gate --path secureinjections/rules/canonical
      - run: secureinjections evaluate --corpus corpus --split validation --fail-on-mismatch
      - run: secureinjections evaluate --corpus corpus --split holdout
      - run: secureinjections release-gate --corpus corpus
      - run: python -m build
