version: 1
rules:
  - id: NET-001
    name: Cloud metadata endpoint
    category: ssrf
    description: References a common cloud instance metadata endpoint.
    severity: critical
    patterns:
      - '(?:169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200)(?::\d+)?(?:/|\b)'
      - '\bmetadata/identity/oauth2/token\b'
    tags: [ssrf, cloud-metadata]
    references: [https://owasp.org/www-community/attacks/Server_Side_Request_Forgery]
    enabled: true
  - id: NET-002
    name: Localhost target
    category: ssrf
    description: A URL or network target points at the local host.
    severity: high
    patterns:
      - '(?:https?|ftp|gopher|file)://(?:localhost|127(?:\.\d{1,3}){3}|\[?::1\]?)(?::\d+)?(?:[/\s]|$)'
    tags: [ssrf, localhost]
    references: []
    enabled: true
  - id: NET-003
    name: Private network target
    category: ssrf
    description: A URL points into an RFC1918 private network range.
    severity: high
    patterns:
      - '(?:https?|ftp|gopher)://(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})(?::\d+)?(?:[/\s]|$)'
    tags: [ssrf, private-network]
    references: [https://www.rfc-editor.org/rfc/rfc1918]
    enabled: true
  - id: NET-004
    name: Dangerous URL scheme
    category: suspicious_url
    description: Uses a URL scheme commonly associated with local access or command-like behavior.
    severity: high
    patterns:
      - '\b(?:file|gopher|dict|ldap)://'
    tags: [url, scheme]
    references: []
    enabled: true
  - id: NET-005
    name: URL with embedded credentials
    category: suspicious_url
    description: A URL contains a username or credential before the host.
    severity: medium
    patterns:
      - '\bhttps?://[^\s/@:]+:[^\s/@]+@[^\s/]+'
    tags: [url, credentials]
    references: []
    enabled: true
  - id: NET-006
    name: Obfuscated numeric IP URL
    category: suspicious_url
    description: A URL uses an integer or hexadecimal host representation.
    severity: medium
    patterns:
      - '\bhttps?://(?:0x[0-9a-f]{7,8}|\d{8,10})(?::\d+)?(?:/|\b)'
    tags: [url, obfuscation]
    references: []
    enabled: true

