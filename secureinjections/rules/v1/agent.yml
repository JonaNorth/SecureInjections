version: 1
rules:
  - id: AG-001
    name: Agent tool coercion
    category: agent_manipulation
    description: Directs an agent to invoke tools or functions while overriding normal controls.
    severity: high
    patterns:
      - '\b(?:use|invoke|call|run)\s+(?:the\s+)?(?:tool|function|plugin|connector)\b.{0,80}\b(?:without|bypass|ignore|secretly)\b'
      - '\b(?:tool|function)[_-]?call\s*[:=]'
    tags: [agent, tools]
    references: []
    enabled: true
  - id: AG-002
    name: Unauthorized credential access
    category: credential_access
    description: Requests access to credentials, secrets, API keys, or tokens.
    severity: high
    patterns:
      - '\b(?:read|show|print|dump|exfiltrate|retrieve|steal|access)\s+(?:the\s+|all\s+|my\s+|your\s+)?(?:credentials?|secrets?|api[_ -]?keys?|access[_ -]?tokens?|passwords?)\b'
      - '\b(?:credentials?|secrets?|tokens?)\s+(?:file|store|manager|vault)\b'
    tags: [agent, credentials]
    references: []
    enabled: true
  - id: AG-003
    name: Environment variable access
    category: credential_access
    description: Requests environment-variable enumeration or sensitive variable access.
    severity: high
    patterns:
      - '\b(?:print|show|read|dump|list|return)\s+(?:all\s+|the\s+)?(?:environment\s+variables?|env(?:ironment)?|process\.env)\b'
      - '\b(?:os\.environ|getenv|process\.env|/proc/self/environ)\b'
    tags: [agent, environment, credentials]
    references: []
    enabled: true
  - id: AG-004
    name: Internal API access request
    category: internal_resource_access
    description: Requests calls to internal, private, or undocumented APIs.
    severity: medium
    patterns:
      - '\b(?:call|query|access|fetch|request)\s+(?:the\s+)?(?:internal|private|admin|undocumented)\s+(?:api|endpoint|service)\b'
    tags: [agent, internal-api]
    references: []
    enabled: true
  - id: AG-005
    name: Local file access request
    category: file_access
    description: Directs an agent to read sensitive local files.
    severity: high
    patterns:
      - '\b(?:read|open|show|print|dump|return)\s+(?:the\s+)?(?:local\s+|system\s+)?(?:file|filesystem)\b'
      - '(?:/etc/(?:passwd|shadow|hosts)|~/\.ssh|\.aws/credentials|\.env\b)'
    tags: [agent, files]
    references: []
    enabled: true

