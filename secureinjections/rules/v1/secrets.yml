version: 1
rules:
  - id: SEC-001
    name: JSON Web Token
    category: secret_leakage
    description: A value resembling a signed JSON Web Token was present.
    severity: high
    patterns:
      - '\beyJ[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\.[A-Za-z0-9_-]{5,}\b'
    tags: [secret, jwt]
    references: [https://www.rfc-editor.org/rfc/rfc7519]
    enabled: true
  - id: SEC-002
    name: GitHub token
    category: secret_leakage
    description: A token matching a GitHub credential prefix was present.
    severity: critical
    patterns:
      - '\b(?:gh[pousr]_[A-Za-z0-9]{20,255}|github_pat_[A-Za-z0-9_]{22,255})\b'
    tags: [secret, github]
    references: [https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository]
    enabled: true
  - id: SEC-003
    name: AWS access key identifier
    category: secret_leakage
    description: A value matching an AWS access key identifier was present.
    severity: critical
    patterns:
      - '\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'
    tags: [secret, aws]
    references: [https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds.html]
    enabled: true
  - id: SEC-004
    name: Bearer token
    category: secret_leakage
    description: An HTTP bearer credential was present.
    severity: high
    patterns:
      - '\bBearer\s+[A-Za-z0-9._~+/-]{16,}={0,2}\b'
    tags: [secret, bearer]
    references: [https://www.rfc-editor.org/rfc/rfc6750]
    enabled: true
  - id: SEC-005
    name: Private key material
    category: secret_leakage
    description: A PEM private-key header was present.
    severity: critical
    patterns:
      - '-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'
    tags: [secret, private-key]
    references: []
    enabled: true
  - id: SEC-006
    name: API key assignment
    category: secret_leakage
    description: A likely secret was assigned to an API key or token variable.
    severity: high
    patterns:
      - '(?<![A-Za-z0-9])(?:api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret)\s*[:=]\s*["'']?[A-Za-z0-9_./+~-]{16,}["'']?'
    tags: [secret, assignment]
    references: []
    enabled: true
  - id: SEC-007
    name: High-entropy token assignment
    category: secret_leakage
    description: A long mixed-character value assigned to a secret-like name was present.
    severity: medium
    patterns:
      - '(?<![A-Za-z0-9])(?:secret|password|passwd|credential)\s*[:=]\s*["'']?[A-Za-z0-9_./+~!@#$%^&*-]{24,}["'']?'
    tags: [secret, generic]
    references: []
    enabled: true
  - id: SEC-008
    name: Generic high-entropy secret
    category: secret_leakage
    description: A long, high-entropy token-like value was present.
    severity: medium
    patterns:
      - '(?<![A-Za-z0-9])[A-Za-z0-9_./+~-]{32,128}(?![A-Za-z0-9])'
    tags: [secret, generic, entropy-check]
    references: []
    enabled: true
