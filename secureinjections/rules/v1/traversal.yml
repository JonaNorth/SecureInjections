version: 1
rules:
  - id: PATH-001
    name: Parent-directory traversal
    category: path_traversal
    description: Contains repeated parent-directory traversal segments.
    severity: high
    patterns:
      - '(?:\.\.[/\\]){2,}'
      - '(?:%2e%2e(?:%2f|%5c)){2,}'
    tags: [path, traversal]
    references: [https://owasp.org/www-community/attacks/Path_Traversal]
    enabled: true
  - id: PATH-002
    name: Traversal to sensitive file
    category: path_traversal
    description: Combines traversal with a common sensitive filesystem target.
    severity: critical
    patterns:
      - '(?:\.\.[/\\]){1,64}(?:etc[/\\](?:passwd|shadow|hosts)|proc[/\\]self[/\\]environ|windows[/\\]win\.ini)'
    tags: [path, traversal, sensitive-file]
    references: []
    enabled: true
