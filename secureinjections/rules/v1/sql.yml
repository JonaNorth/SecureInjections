version: 1
rules:
  - id: SQL-001
    name: Boolean SQL injection
    category: sql_injection
    description: Contains a quoted boolean tautology typical of SQL injection.
    severity: high
    patterns:
      - '(?:''|%27|\")\s*(?:or|and)\s+(?:''?\w+''?|\d+)\s*=\s*(?:''?\w+''?|\d+)'
      - '\b(?:or|and)\s+1\s*=\s*1(?:\s*(?:--|#|/\*))?'
    tags: [sql, injection]
    references: [https://owasp.org/www-community/attacks/SQL_Injection]
    enabled: true
  - id: SQL-002
    name: UNION SELECT injection
    category: sql_injection
    description: Contains a UNION-based SQL query manipulation indicator.
    severity: high
    patterns:
      - '\bunion(?:\s+all)?\s+select\b'
    tags: [sql, injection, union]
    references: []
    enabled: true
  - id: SQL-003
    name: Stacked destructive SQL statement
    category: sql_injection
    description: Contains a statement separator followed by a destructive SQL operation.
    severity: critical
    patterns:
      - ';\s*(?:drop|truncate|alter|delete)\s+(?:table|database|from)\b'
    tags: [sql, injection, destructive]
    references: []
    enabled: true
  - id: SQL-004
    name: SQL comment termination
    category: sql_injection
    description: Combines quote termination with an inline SQL comment.
    severity: medium
    patterns:
      - '(?:''|%27|\")\s*(?:--|#|/\*)'
    tags: [sql, injection, comment]
    references: []
    enabled: true
