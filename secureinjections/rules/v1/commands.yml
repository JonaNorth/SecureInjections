version: 1
rules:
  - id: CMD-001
    name: Shell execution invocation
    category: shell_command
    description: Contains a common shell interpreter invocation with a command flag.
    severity: high
    patterns:
      - '(?:^|[;&|`\n])\s*(?:/bin/)?(?:ba|z|k|c)?sh\s+-c\b'
      - '\b(?:cmd\.exe\s+/c|powershell(?:\.exe)?\s+(?:-[A-Za-z]{1,24}\s+){0,8})'
    tags: [command, shell]
    references: []
    enabled: true
  - id: CMD-002
    name: Destructive or reconnaissance command
    category: shell_command
    description: Contains a high-risk filesystem or host reconnaissance command sequence.
    severity: high
    patterns:
      - '(?:^|[;&|`\n])\s*(?:sudo\s+)?(?:rm\s+-[a-z]*r[a-z]*f|chmod\s+[0-7]{3,4}|chown\s+|id\b|whoami\b|uname\s+-a|cat\s+/etc/)'
    tags: [command, shell]
    references: []
    enabled: true
  - id: CMD-003
    name: Download and execute pipeline
    category: shell_command
    description: Pipes downloaded content into a shell or interpreter.
    severity: critical
    patterns:
      - '\b(?:curl|wget)\b[^\r\n|]{0,300}\|\s*(?:sudo\s+)?(?:ba|z|k|c)?sh\b'
    tags: [command, download, execution]
    references: []
    enabled: true
  - id: CMD-004
    name: Package manager execution
    category: package_manager
    description: Attempts to install packages through a common system or language package manager.
    severity: medium
    patterns:
      - '(?:^|[;&|`\n])\s*(?:sudo\s+)?(?:apt(?:-get)?|yum|dnf|apk|brew)\s+install\b'
      - '(?:^|[;&|`\n])\s*(?:python\s+-m\s+)?(?:pip|pip3|npm|pnpm|yarn|gem)\s+(?:install|add)\b'
    tags: [command, package-manager]
    references: []
    enabled: true
  - id: CMD-005
    name: Command substitution
    category: shell_command
    description: Contains shell command substitution around a sensitive command.
    severity: medium
    patterns:
      - '\$\(\s*(?:cat|curl|wget|env|printenv|id|whoami)\b'
      - '`\s*(?:cat|curl|wget|env|printenv|id|whoami)\b[^`]*`'
    tags: [command, substitution]
    references: []
    enabled: true
